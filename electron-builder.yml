# Windows installer and auto-update (roadmap M12). Build with `npm run dist`,
# publish with `npm run release` (needs GH_TOKEN). See docs/deployment.md.
appId: com.permanentseo.pseotracker
productName: PSEO Tracker
copyright: Copyright © 2026 Permanent SEO
directories:
  output: dist
  buildResources: build
# Release builds go to out-release/, never out/ (which the development copy runs).
files:
  - out-release/**
  - package.json
  - '!**/*.map'
extraMetadata:
  main: out-release/main/index.js
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: PSEO-Tracker-Setup-${version}.${ext}
nsis:
  # Per-user, one click: no admin rights needed, and updates install silently.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PSEO Tracker
  runAfterFinish: true
  deleteAppDataOnUninstall: false
# GitHub Releases of the (public) source repo, so the app can update without a token.
publish:
  provider: github
  owner: permanentseoteam-dev
  repo: Agency-Employee-Tracking
  releaseType: release
